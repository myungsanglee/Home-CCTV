<html>
    <head>
        <meta name="description" content="M&N Home CCTV">
        <meta name="author" content="Michael Lee">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Bootstrap core CSS -->
        <link href="/static/css/bootstrap.min.css" rel="stylesheet">

        <!-- Bootstrap Font Icon CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">

        <!-- Custom CSS -->
        <link rel="stylesheet" href="/static/css/get_cam_style.css">
        <link rel="stylesheet" href="/static/css/recordings_style.css">

        <title>M&N Home CCTV - 녹화</title>
    </head>
    <body>
        <nav class="navbar p-3">
            <div class="container-fluid">
                <a href="/" class="navbar-brand ">
                    <span class="fs-4 text-white">M&N Home CCTV</span>
                </a>

                <div class="d-flex justify-content-end gap-2">
                    <button class="btn btn-outline-light" type="button" onClick="location.href='/get_cam'">실시간</button>
                    <button class="btn btn-outline-light" type="button" onClick="location.href='/logout'">Logout</button>
                </div>
            </div>
        </nav>

        {% if tapo_enabled %}
        <ul class="nav nav-pills justify-content-center mt-3" id="camTabs">
            <li class="nav-item">
                <button class="nav-link" type="button" data-cam="pi" onClick="setCam('pi')">Pi 카메라</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" type="button" data-cam="tapo" onClick="setCam('tapo')">Tapo</button>
            </li>
        </ul>
        {% endif %}

        <div class="container my-3">
            <video id="player" class="w-100 rounded bg-black" controls playsinline preload="metadata"></video>

            <div class="d-flex align-items-center justify-content-between mt-2">
                <span id="nowPlaying" class="text-muted">재생할 영상을 고르세요</span>
                <a id="downloadBtn" class="btn btn-outline-secondary btn-sm disabled" href="#">
                    <span class="bi bi-download"></span> 다운로드
                </a>
            </div>

            <div class="d-flex align-items-center gap-2 mt-3">
                <div id="days" class="d-flex flex-wrap gap-1 flex-grow-1"></div>
                <button class="btn btn-outline-success btn-sm" type="button" onClick="loadClips()">
                    <span class="bi bi-arrow-clockwise"></span>
                </button>
            </div>

            <div class="d-flex align-items-center justify-content-between mt-3">
                <small class="text-muted">
                    <span class="legend-motion"></span> 움직임 있음
                </small>
                <div class="form-check form-switch m-0">
                    <input class="form-check-input" type="checkbox" id="motionOnly" onChange="onMotionOnly(event)">
                    <label class="form-check-label" for="motionOnly">움직임 구간만</label>
                </div>
            </div>

            <div id="clips" class="mt-2"></div>
        </div>

        <script>
            const TAPO_ENABLED = {{ 'true' if tapo_enabled else 'false' }};
            const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
            const player = document.getElementById('player');

            let currentCam = 'pi';
            let clips = [];      // 녹화가 끝난 10분 단위 영상, 오래된 순
            let selectedDay = null;
            let playingIndex = -1;
            let motionOnly = localStorage.getItem('recMotionOnly') === '1';
            document.getElementById('motionOnly').checked = motionOnly;

            function onMotionOnly(event) {
                motionOnly = event.target.checked;
                localStorage.setItem('recMotionOnly', motionOnly ? '1' : '0');
                renderClips();
            }

            function setCam(cam) {
                if (cam === 'tapo' && !TAPO_ENABLED) cam = 'pi';
                currentCam = cam;
                localStorage.setItem('recCam', cam);
                document.querySelectorAll('#camTabs .nav-link').forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.cam === cam);
                });
                player.removeAttribute('src');
                player.load();
                playingIndex = -1;
                selectedDay = null;
                setNowPlaying(null);
                loadClips();
            }

            async function loadClips() {
                const response = await fetch(`/recordings/list?cam=${currentCam}`);
                clips = response.ok ? await response.json() : [];
                const days = [...new Set(clips.map(c => c.start.slice(0, 10)))].sort().reverse();
                if (!days.includes(selectedDay)) selectedDay = days[0] || null;
                renderDays(days);
                renderClips();
            }

            function dayLabel(day) {
                const d = new Date(day + 'T00:00:00');
                return `${d.getMonth() + 1}/${d.getDate()} (${WEEKDAYS[d.getDay()]})`;
            }

            function renderDays(days) {
                const box = document.getElementById('days');
                box.innerHTML = '';
                days.forEach(day => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'btn btn-sm ' + (day === selectedDay ? 'btn-success' : 'btn-outline-success');
                    btn.textContent = dayLabel(day);
                    btn.onclick = () => { selectedDay = day; renderDays(days); renderClips(); };
                    box.appendChild(btn);
                });
            }

            // 선택한 날짜의 영상을 시간별 줄로 보여줌 (한 줄 = 한 시간, 버튼 = 10분)
            function renderClips() {
                const box = document.getElementById('clips');
                box.innerHTML = '';
                if (!selectedDay) {
                    box.innerHTML = '<p class="text-muted">녹화된 영상이 없어요. 녹화 중인 최근 10분은 끝나야 보여요.</p>';
                    return;
                }
                const hours = {};
                clips.forEach((c, i) => {
                    if (c.start.slice(0, 10) !== selectedDay) return;
                    if (motionOnly && !c.motion && i !== playingIndex) return;
                    const hour = c.start.slice(11, 13);
                    (hours[hour] = hours[hour] || []).push(i);
                });
                Object.keys(hours).sort().reverse().forEach(hour => {
                    const row = document.createElement('div');
                    row.className = 'clip-row';
                    const label = document.createElement('span');
                    label.className = 'clip-hour';
                    label.textContent = `${hour}시`;
                    row.appendChild(label);
                    hours[hour].forEach(i => {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'btn btn-sm clip-btn ' +
                            (i === playingIndex ? 'btn-success' : (clips[i].motion ? 'clip-motion' : 'btn-outline-secondary'));
                        btn.textContent = clips[i].start.slice(11, 16);
                        btn.onclick = () => play(i);
                        row.appendChild(btn);
                    });
                    box.appendChild(row);
                });
                if (!box.children.length) {
                    box.innerHTML = '<p class="text-muted">이 날은 움직임이 기록된 구간이 없어요.</p>';
                }
            }

            function setNowPlaying(clip) {
                const label = document.getElementById('nowPlaying');
                const download = document.getElementById('downloadBtn');
                if (!clip) {
                    label.textContent = '재생할 영상을 고르세요';
                    download.classList.add('disabled');
                    download.href = '#';
                    return;
                }
                const day = clip.start.slice(0, 10);
                label.textContent = `${dayLabel(day)} ${clip.start.slice(11, 16)} ~ ${clip.end.slice(11, 16)}`;
                download.classList.remove('disabled');
                download.href = `/recordings/file/${currentCam}/${clip.name}?download=1`;
            }

            function play(i) {
                playingIndex = i;
                const clip = clips[i];
                player.src = `/recordings/file/${currentCam}/${clip.name}`;
                player.play().catch(() => {});
                selectedDay = clip.start.slice(0, 10);
                setNowPlaying(clip);
                renderDays([...new Set(clips.map(c => c.start.slice(0, 10)))].sort().reverse());
                renderClips();
            }

            // 한 영상이 끝나면 다음 10분 영상을 이어서 재생
            player.addEventListener('ended', () => {
                if (playingIndex >= 0 && playingIndex + 1 < clips.length) play(playingIndex + 1);
            });

            setCam(localStorage.getItem('recCam') || 'pi');
        </script>
    </body>
</html>
